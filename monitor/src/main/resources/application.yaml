spring:
  application:
    name: Monitor
  web:
    resources:
      cache:
        period: '0'
      chain:
        cache: 'false'
        enabled: 'false'

server:
  port: 8081

monitor:
  refresh: 10
  servers:
     file: servers.xml
  swagger:
     external-dir: C:/DevEnvironment/src/java/monitor-workspace/swagger

slack:
  enabled: true