spring:
  application:
    name: swagger-monitor

# Carpetas bajo %BM_HOME%\appl que NO deben tratarse como dominios
# de negocio en el analisis de Impacto/Dependencias (ademas de la
# propia carpeta del microservicio objetivo, "osba", que siempre se
# excluye). Lista separada por comas.
impacto:
  dominios-excluidos: swagger-generator,swagger-monitor

  # Ruta al artefacto del microservicio dueno de cada dominio, para
  # completar la "Informacion Tecnica" de la ficha tecnica (Java,
  # Spring Boot, artifactId, packaging). Puede ser un pom.xml suelto
  # (si hay acceso a fuentes) o, el caso mas comun en un servidor sin
  # fuentes, el .jar o .war ya compilado: ahi se lee el pom.xml y el
  # MANIFEST.MF que Maven/Spring Boot embeben dentro del artefacto.
  # La clave debe ser el nombre de dominio EXACTO tal como aparece en
  # la pestana Impacto/Dependencias (ej. "Persona", "Pagos" - con
  # mayuscula inicial). Si un dominio no tiene ruta configurada, o el
  # archivo no existe, esos campos quedan en "N/D" sin romper nada.
  #pom-paths:
  # Persona: C:/deploy/api-persona/api-persona-1.3.0.jar
  # Pagos: C:/deploy/api-pagos/api-pagos.war
  #
  pom-paths:
    creditos: C:\DevEnvironment\src\java\bm-workspace\bm-creditos\pom.xml
    inversiones: C:\DevEnvironment\src\java\bm-workspace\bm-inversiones\pom.xml
    ita: C:\DevEnvironment\src\java\bm-workspace\bm-ita\pom.xml
    mia: C:\DevEnvironment\src\java\bm-workspace\bm-mia\pom.xml
    notifications: C:\DevEnvironment\src\java\bm-workspace\bm-notifications\pom.xml
    onboarding: C:\DevEnvironment\src\java\bm-workspace\bm-onboarding\ws-onboarding\target
    pagos: C:\DevEnvironment\src\java\bm-workspace\bm-pagos\pom.xml
    panama: C:\DevEnvironment\src\java\bm-workspace\bm-panama\pom.xml
    persona: C:\DevEnvironment\src\java\bm-workspace\bm-persona\ws-persona\target
    safe: C:\DevEnvironment\src\java\bm-workspace\bm-safe\pom.xml
    security: C:\DevEnvironment\src\java\bm-workspace\bm-security\pom.xml
    simf: C:\DevEnvironment\src\java\bm-workspace\bm-simf\pom.xml
    tarjeta: C:\DevEnvironment\src\java\bm-workspace\bm-tarjeta\pom.xml